<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPV Drone Builder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/catalog.css" />
  <link rel="stylesheet" href="css/blueprint.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-brand">
      <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="3" fill="currentColor"/>
        <rect x="5" y="14.5" width="22" height="3" rx="1.5" fill="currentColor" opacity="0.3"/>
        <rect x="14.5" y="5" width="3" height="22" rx="1.5" fill="currentColor" opacity="0.3"/>
        <circle cx="6"  cy="6"  r="3.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="26" cy="6"  r="3.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="6"  cy="26" r="3.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="26" cy="26" r="3.5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="brand-name">FPV Builder</span>
    </div>

    <div class="header-build-name">
      <input id="build-name" type="text" value="My Build" maxlength="40"
             spellcheck="false" aria-label="Build name" />
    </div>

    <div class="header-actions">
      <button id="btn-reset"     class="btn btn-ghost"  title="Clear build">Reset</button>
      <button id="btn-my-builds" class="btn btn-ghost"  title="Saved builds">Builds</button>
      <button id="btn-save"      class="btn btn-ghost"  title="Save to browser">Save</button>
      <button id="btn-share"     class="btn btn-accent" title="Copy share link">Share</button>
    </div>
  </header>

  <!-- MAIN — 3-COLUMN LAYOUT -->
  <main class="app-main">

    <!-- LEFT PANEL -->
    <aside class="left-panel" id="left-panel">

      <!-- Mobile drawer handle -->
      <div class="drawer-handle" id="drawer-handle" role="button" aria-label="Toggle build panel">
        <div class="drawer-pill"></div>
        <div class="drawer-status">
          <span class="drawer-status-text" id="drawer-status-text">Tap to configure</span>
          <div class="drawer-progress-wrap">
            <span class="drawer-progress-count" id="drawer-progress-count">0 / 9</span>
            <div class="drawer-progress-bar">
              <div class="drawer-progress-fill" id="drawer-progress-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Build Overview Card -->
      <div class="build-card">
        <div class="build-card-header">
          <span class="build-card-title">Build Progress</span>
          <span class="build-card-count" id="build-progress-count">0 / 9</span>
        </div>
        <div class="build-progress-track">
          <div class="build-progress-fill" id="build-progress-fill"></div>
        </div>
        <div class="build-stats">
          <div class="build-stat">
            <span class="build-stat-value" id="summary-weight">—</span>
            <span class="build-stat-label">Weight</span>
          </div>
          <div class="build-stat">
            <span class="build-stat-value" id="summary-price">—</span>
            <span class="build-stat-label">Price</span>
          </div>
          <div class="build-stat">
            <span class="build-stat-value" id="summary-twr">—</span>
            <span class="build-stat-label">TWR</span>
          </div>
          <div class="build-stat">
            <span class="build-stat-value" id="summary-battery">—</span>
            <span class="build-stat-label">Battery</span>
          </div>
        </div>
        <div class="compat-violations" id="compat-violations" hidden></div>
      </div>

      <!-- Step Navigator -->
      <div class="step-nav" id="step-nav">
        <button class="step-nav-btn" id="btn-step-prev" aria-label="Previous component" disabled>‹</button>
        <div class="step-nav-center">
          <div class="step-nav-header">
            <span class="step-nav-icon" id="step-nav-icon">🛸</span>
            <span class="step-nav-label" id="step-nav-label">Frame</span>
          </div>
          <div class="step-nav-sub" id="step-nav-sub">Not selected</div>
          <div class="step-nav-dots" id="step-nav-dots"></div>
        </div>
        <button class="step-nav-btn" id="btn-step-next" aria-label="Next component">›</button>
      </div>

      <!-- Slot list + Presets -->
      <div class="panel-view">
        <ul class="slot-list" id="slot-list" role="list"></ul>

        <div class="preset-section">
          <div class="panel-section-title">Quick Builds</div>
          <div class="preset-buttons">
            <button class="btn btn-preset" data-preset="freestyle-5inch">5" Freestyle</button>
            <button class="btn btn-preset" data-preset="race-5inch">5" Race</button>
            <button class="btn btn-preset" data-preset="toothpick-3inch">3" Toothpick</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- CENTER — Blueprint diagram -->
    <section class="blueprint-section" id="blueprint-section">
      <div id="blueprint-wrap" class="blueprint-wrap"></div>
      <div class="blueprint-hud">
        <div class="blueprint-hint" id="blueprint-hint">Click a component to select parts</div>
      </div>
    </section>

    <!-- RIGHT PANEL — Parts catalog -->
    <aside class="right-panel" id="right-panel">

      <!-- Mobile bottom-sheet handle -->
      <div class="right-drawer-handle" id="right-drawer-handle">
        <div class="drawer-pill"></div>
        <button class="mobile-panel-close" id="btn-right-close" aria-label="Close parts panel">✕</button>
      </div>

      <!-- Catalog view -->
      <div class="panel-view" id="view-catalog" hidden>
        <div class="catalog-header">
          <button class="btn btn-ghost btn-back" id="btn-back">
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M10 3L5 8l5 5"/>
            </svg>
            Back
          </button>
          <span class="catalog-slot-label" id="catalog-slot-label">Select Frame</span>
          <button class="btn btn-ghost btn-compare-toggle" id="btn-compare-toggle">Compare</button>
        </div>

        <div class="catalog-search-row">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input id="catalog-search" type="search" placeholder="Search parts…" autocomplete="off" />
          </div>
          <select id="catalog-sort" aria-label="Sort parts">
            <option value="name">A–Z</option>
            <option value="price_asc">Price ↑</option>
            <option value="price_desc">Price ↓</option>
            <option value="weight_asc">Weight ↑</option>
          </select>
        </div>

        <div class="filter-pills" id="filter-pills">
          <button class="pill active" data-filter="all">All</button>
          <button class="pill" data-filter="in_stock">● In Stock</button>
        </div>

        <ul class="part-list" id="part-list" role="list"></ul>

        <!-- Compare bar -->
        <div class="compare-bar" id="compare-bar" hidden>
          <div class="compare-bar-parts" id="compare-bar-parts"></div>
          <button class="btn btn-accent" id="btn-compare-open" disabled>Compare (0)</button>
        </div>
      </div>

    </aside>
  </main>

  <!-- MOBILE OVERLAY -->
  <div class="mobile-overlay" id="mobile-overlay" aria-hidden="true"></div>

  <!-- MODAL: COMPARE -->
  <dialog id="modal-compare" class="modal modal-wide">
    <div class="modal-header">
      <h2 class="modal-title">Compare Parts</h2>
      <button id="modal-compare-close" class="modal-close-btn" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div id="compare-table-container"></div>
    </div>
  </dialog>

  <!-- MODAL: MY BUILDS -->
  <dialog id="modal-saves" class="modal modal-saves">
    <div class="modal-header">
      <div class="modal-title-group">
        <h2 class="modal-title">My Builds</h2>
        <span class="modal-saves-count" id="modal-saves-count"></span>
      </div>
      <div class="modal-header-actions">
        <button id="btn-save-in-modal" class="btn btn-accent btn-sm">+ Save Current</button>
        <button id="modal-saves-close" class="modal-close-btn" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="saves-list"></div>
    </div>
  </dialog>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
